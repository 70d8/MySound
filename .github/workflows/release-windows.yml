name: Release Windows

# สร้างตัวติดตั้ง .exe ของแอป PC ให้อัตโนมัติ
# วิธีใช้: git tag v0.1.0 && git push origin v0.1.0  (หรือกด Run workflow เอง)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # ต้องใช้สร้าง Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test (Rust)
        working-directory: app/src-tauri
        run: cargo test

      - name: Type check (Svelte)
        working-directory: app
        run: npx svelte-check --threshold error

      - name: Build installer and publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: MySound ${{ github.ref_name }}
          releaseDraft: true # ตรวจก่อนค่อยกด Publish เอง
          args: --bundles nsis

      - name: Keep installer as artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mysound-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
